        <main>
            <div class="login-display">
                <div class="login-image"><img src="/images/login.webp" /></div>
                <form class="login-form">
                    <label for="username"
                        >Username:
                        <input
                            type="email"
                            name="email"
                            autocomplete="username"
                            required /></label
                    ><br />
                    <label for="password"
                        >Password:
                        <input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        /> </label
                    ><br /><br />
                    <button type="submit">Login</button>
                    <script></script>
                </form>
            </div>
        </main>
