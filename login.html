<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Presentación de nuestro grupo</title>
        <link rel="stylesheet" href="styles/style.css" />
    </head>
    <body>
        <header>
            <div></div>
            <div class="header-item">
                <h1>We Are Pablo & Jose</h1>
                <div>
                    <a href="pablo.html">Pablo</a>
                    |
                    <a href="jose.html">Jose</a>
                </div>
            </div>
            <div></div>
        </header>
        <main>
            <div class="login-display">
                <div class="login-image"><img src="/images/login.webp" /></div>
                <div name= "form" class="login-form">
                    <label
                        >Username:<br>
                        <input
                            type="username"
                            name="username"
                            id="username"
                            autocomplete="username"
                            required /></label
                    ><br />
                    <label
                        >Password:<br>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        /> </label

                    ><br />
                    <p id="demo" class="invalidPassword"></p>
                    <br />
                    <button onclick="myFunction()" type="button">Login</button>
                    <script>
                        function isValid(str){
                            if (str.length < 8) return false;

                            let upperCount = 0;
                            let digitCount = 0;
                            let specialCount = 0;

                            for (const ch of str){
                                if(/[A-Z]/.test(ch)) upperCount++;
                                else if (/[0-9]/.test(ch)) digitCount++;
                                else if (/[^A-Za-z0-9]/.test(ch)) specialCount++;
                            }

                            return upperCount === 2 && digitCount === 1 && specialCount === 1;

                        }
                        function myFunction() {
                            // Get the value of the input field with id="numb"
                            let x = document.getElementById("password").value;
                            // If x is Not a Number or less than one or greater than 10
                            let text;
                            if (isValid(x)) {
                                window.location.href = "index.html";
                                text = "";
                            } else {
                                text = "Password not valid";
                            }
                            document.getElementById("demo").innerHTML = text;
                        }
                    </script>
                </div>
            </div>
        </main>
        <footer>&copy; 2025 Nuestro Grupo</footer>
    </body>
</html>
